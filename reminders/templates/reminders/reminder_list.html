<h1>Reminder App</h1>

<h2>Create a Reminder</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Reminder</button>
</form>

{% for reminder in reminders %}
    <p>{{ reminder.reminder_text }}</p>
    <p>{{ reminder.due_date }}</p>
{% empty %}
    <p>No reminders found.</p>
{% endfor %}
